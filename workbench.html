<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Sun 工作台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<style>
:root{--p:#5B9BD5;--p2:#4A90D9;--p3:#357ABD;--p4:#7EC8E3;--bg:#F0F5FB;--card:#fff;--t:#2C3E50;--t2:#7F8C8D;--t3:#BDC3C7;--g:#27AE60;--o:#F39C12;--r:#E74C3C;--b:1px solid #E8EDF2;--s:0 2px 12px rgba(91,155,213,.1);--s2:0 4px 20px rgba(91,155,213,.15);--rds:14px;--rds2:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;display:flex}
/* Sidebar */
.sidebar{width:220px;min-height:100vh;background:linear-gradient(180deg,#4A90D9 0%,#357ABD 50%,#2C6AA0 100%);color:#fff;padding:24px 0;position:fixed;left:0;top:0;bottom:0;z-index:100;display:flex;flex-direction:column;transition:transform .3s;overflow-y:auto}
.sidebar-logo{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px}
.sidebar-logo h2{font-size:20px;font-weight:700;letter-spacing:1px}
.sidebar-logo .sub{font-size:11px;opacity:.7;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;font-size:14px;color:rgba(255,255,255,.75);transition:all .2s;border-left:3px solid transparent;margin:2px 0}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;border-left-color:#fff;font-weight:600}
.nav-item .icon{font-size:18px;width:24px;text-align:center}
/* Main */
.main{margin-left:220px;flex:1;padding:20px 24px;min-height:100vh}
.section{display:none}
.section.active{display:block}
.section-header{margin-bottom:20px}
.section-header h2{font-size:22px;font-weight:700;color:var(--t);display:flex;align-items:center;gap:8px}
.section-header .desc{font-size:13px;color:var(--t2);margin-top:4px}
/* Date Nav */
.date-nav{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.date-nav .cur-date{font-size:16px;font-weight:600;min-width:130px;text-align:center;color:var(--p2)}
.date-nav .nav-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--card);box-shadow:var(--s);cursor:pointer;font-size:16px;color:var(--p);display:flex;align-items:center;justify-content:center;transition:all .2s}
.date-nav .nav-btn:hover{background:var(--p);color:#fff;box-shadow:var(--s2)}
.date-nav .today-btn{padding:6px 16px;border-radius:20px;border:none;background:var(--p);color:#fff;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s}
.date-nav .today-btn:hover{background:var(--p3)}
/* Card */
.card{background:var(--card);border-radius:var(--rds);padding:20px;box-shadow:var(--s);margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--t);display:flex;align-items:center;gap:6px}
/* Checkbox */
.check-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F8FAFD;border-radius:var(--rds2);margin-bottom:8px;cursor:pointer;transition:all .2s;border:2px solid transparent}
.check-row:hover{border-color:var(--p4)}
.check-row.done{background:#E8F5E9;border-color:var(--g)}
.check-row.done .check-label{color:var(--g);text-decoration:line-through}
.check-box{width:22px;height:22px;border-radius:6px;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;color:#fff;font-size:13px}
.check-row.done .check-box{background:var(--g);border-color:var(--g)}
.check-label{font-size:14px;flex:1}
.exercise-note-wrap{padding:0 14px 10px 44px;margin-top:-2px}
.exercise-note{min-height:56px;font-size:13px;border-radius:8px;background:#F8FAFD}
/* Textarea & Input */
textarea,input[type=text],input[type=number]{width:100%;padding:12px 14px;border:2px solid #E8EDF2;border-radius:var(--rds2);font-size:14px;font-family:inherit;resize:vertical;transition:border .2s;background:#FAFBFC;color:var(--t)}
textarea:focus,input:focus{outline:none;border-color:var(--p);background:#fff}
textarea{min-height:100px}
.mood-select{display:flex;gap:8px;margin-bottom:12px}
.mood-dot{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:#fff}
.mood-dot.selected{border-color:var(--p);transform:scale(1.15);box-shadow:0 0 0 3px rgba(91,155,213,.2)}
.btn{padding:8px 20px;border-radius:22px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--p);color:#fff}
.btn-primary:hover{background:var(--p3);box-shadow:var(--s2)}
.btn-light{background:#F0F4F8;color:var(--t)}
.btn-light:hover{background:#E2E8F0}
.btn-sm{padding:5px 14px;font-size:12px;border-radius:16px}
/* Calendar */
.cal-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-header .month-label{font-size:16px;font-weight:700;color:var(--p2);min-width:100px;text-align:center}
.cal-header .cal-nav{width:30px;height:30px;border-radius:50%;border:none;background:var(--card);box-shadow:var(--s);cursor:pointer;font-size:14px;color:var(--p)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-header{text-align:center;font-size:11px;font-weight:600;color:var(--t2);padding:6px 0}
.cal-cell{border-radius:var(--rds2);padding:8px 4px;text-align:center;background:#FAFBFC;cursor:pointer;transition:all .2s;border:2px solid transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.cal-cell:hover{border-color:var(--p4);box-shadow:var(--s)}
.cal-cell.today{border-color:var(--p);background:#EBF3FB}
.cal-cell.selected{border-color:var(--p2);background:#E3EEFA}
.cal-cell.other-month{opacity:.35}
.cal-cell .day-num{font-size:14px;font-weight:600;color:var(--t)}
.cal-cell.today .day-num{color:var(--p)}
.cal-cell .day-val{font-size:11px;color:var(--p2);margin-top:2px;font-weight:600}
.cal-cell .day-val.negative{color:var(--g)}
.cal-cell .day-val.positive{color:var(--r)}
/* stats row */
.stats-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{flex:1;min-width:120px;background:var(--card);border-radius:var(--rds);padding:16px;box-shadow:var(--s);text-align:center}
.stat-card .stat-val{font-size:24px;font-weight:700;color:var(--p);margin-bottom:4px}
.stat-card .stat-label{font-size:12px;color:var(--t2)}
/* chart container */
.chart-wrap{max-width:400px;margin:12px auto}
/* expense form */
.exp-row{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.exp-row .exp-label{width:80px;font-size:13px;font-weight:600;color:var(--t);flex-shrink:0}
.exp-row input{width:100px;flex-shrink:0}
.exp-row .exp-note{flex:1;min-width:120px;font-size:12px}
.exp-row .exp-note input{width:100%}
/* entries list */
.entry-list{max-height:400px;overflow-y:auto}
.entry-item{background:#FAFBFC;border-radius:var(--rds2);padding:14px;margin-bottom:8px;border-left:3px solid var(--p);transition:all .2s}
.entry-item .entry-date{font-size:11px;color:var(--t2);margin-bottom:4px}
.entry-item .entry-content{font-size:14px;color:var(--t);white-space:pre-wrap}
.entry-item .entry-mood{font-size:18px;margin-top:4px}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--t);color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;z-index:300;transition:transform .3s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}
/* memo modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--rds);padding:24px;max-width:500px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:80vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:14px;color:var(--t)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* responsive */
@media(max-width:768px){
.sidebar{width:180px;transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.menu-toggle{position:fixed;top:16px;left:16px;z-index:110;width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;border:none;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--s2)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;display:none}
.overlay.show{display:block}
}
@media(min-width:769px){.menu-toggle{display:none}.overlay{display:none !important}}
/* piano list */
.list-item{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#F8FAFD;border-radius:var(--rds2);margin-bottom:6px}
.list-item .item-name{flex:1;font-size:14px}
.list-item .del-btn{color:var(--r);cursor:pointer;font-size:16px;opacity:.6;transition:opacity .2s}
.list-item .del-btn:hover{opacity:1}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1}
/* success diary entries */
.success-entry{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:#F8FAFD;border-radius:var(--rds2);margin-bottom:8px;border-left:3px solid var(--p);animation:fadeIn .3s}
.success-entry .entry-num{width:24px;height:24px;border-radius:50%;background:var(--p);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.success-entry .entry-body{flex:1}
.success-entry .entry-text{font-size:14px;color:var(--t);line-height:1.5}
.success-entry .entry-time{font-size:11px;color:var(--t2);margin-top:2px}
.success-entry .entry-del{color:var(--r);cursor:pointer;font-size:14px;opacity:.5;flex-shrink:0;padding:2px;transition:opacity .2s}
.success-entry .entry-del:hover{opacity:1}
/* trade operation item */
.trade-op{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#F8FAFD;border-radius:var(--rds2);margin-bottom:6px;flex-wrap:wrap;border-left:3px solid var(--p);animation:fadeIn .3s}
.trade-op.buy{border-left-color:var(--r)}
.trade-op.sell{border-left-color:var(--g)}
.trade-op .trade-tag{padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.trade-op.buy .trade-tag{background:var(--r)}
.trade-op.sell .trade-tag{background:var(--g)}
.trade-op .trade-info{flex:1;min-width:0;font-size:13px}
.trade-op .trade-info .trade-name{font-weight:600;color:var(--t)}
.trade-op .trade-info .trade-detail{color:var(--t2);font-size:12px}
.trade-op .trade-del{color:var(--r);cursor:pointer;font-size:14px;opacity:.5;flex-shrink:0;transition:opacity .2s}
.trade-op .trade-del:hover{opacity:1}
/* trade form */
.trade-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.trade-form .full{grid-column:1/-1}
.trade-form select{padding:8px 12px;border:2px solid #E8EDF2;border-radius:var(--rds2);font-size:13px;background:#FAFBFC;color:var(--t);font-family:inherit}
.trade-form select:focus{outline:none;border-color:var(--p)}
/* large dialog textareas */
.big-textarea{min-height:130px;font-size:15px;line-height:1.7;resize:vertical}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
/* qty buttons */
.qty-row{display:flex;align-items:center;gap:6px}
.qty-btn{width:32px;height:32px;border-radius:50%;border:2px solid #E8EDF2;background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--t);font-weight:700}
.qty-btn:hover{background:var(--p);color:#fff;border-color:var(--p)}
.qty-btn.minus:hover{background:var(--g);border-color:var(--g)}
/* returns quick buttons */
.return-quick{display:flex;gap:6px;margin-top:8px}
.return-quick .rq-btn{padding:4px 12px;border-radius:14px;border:2px solid #E8EDF2;background:#fff;font-size:12px;cursor:pointer;transition:all .2s}
.return-quick .rq-btn:hover{border-color:var(--p);background:#EBF3FB}
.return-quick .rq-btn.neg:hover{border-color:var(--g);background:#E8F5E9}
</style>

<body>

<button class="menu-toggle" onclick="toggleSidebar()">☰</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
<div class="sidebar-logo"><h2>☀️ Sun 工作台</h2><div class="sub">日拱一卒，功不唐捐</div></div>
<nav>
<div class="nav-item active" onclick="switchSection('exercise')"><span class="icon">🏃</span>运动记录</div>
<div class="nav-item" onclick="switchSection('piano')"><span class="icon">🎹</span>练琴记录</div>

  <div id="syncStatus" style="font-size:11px;opacity:.7;margin-bottom:8px">☁️ 点击设置云同步</div>
  <button id="syncBtn" onclick="toggleSyncSettings()" style="width:100%;padding:6px 12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;font-size:12px;cursor:pointer">☁️ 云同步设置</button>

<script>
// ==================== DATA ====================
const LZ = window.LZString || { compressToEncodedURIComponent: v=>encodeURIComponent(v), decompressFromEncodedURIComponent: v=>decodeURIComponent(v) };

const today = ()=>new Date().toISOString().slice(0,10);
const formatMoney = v=>{ const n=Number(v)||0; return n>=0?'¥'+n.toFixed(2):'-¥'+Math.abs(n).toFixed(2); };
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

let appData = {};
let currentSection = 'exercise';
let currentDate = today();
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let selectedCalDay = null;

// Default finance checklist
const defaultFinanceChecks = ['记录当日收益','核对账户余额','查看持仓变化','复盘今日操作','制定明日计划'];

// Category config
const expenseCats = [
  {key:'food',label:'🍜 食物',color:'#FF6B6B'},
  {key:'transport',label:'🚗 交通',color:'#4ECDC4'},
  {key:'shopping',label:'🛍 购物',color:'#FFD93D'},
  {key:'living',label:'🏠 生活',color:'#6C5CE7'},
  {key:'exerciseCost',label:'🏃 运动',color:'#A8E6CF'},
  {key:'learning',label:'📚 学习',color:'#74B9FF'},
  {key:'medical',label:'🏥 医疗',color:'#FF8C69'},
  {key:'entertainment',label:'🎮 娱乐',color:'#FF69B4'},
];
const yearExpenseCats = [
  {key:'travel',label:'✈️ 旅行',color:'#FFD700'},
  {key:'insurance',label:'🛡️ 保险',color:'#20B2AA'},
  {key:'redpacket',label:'🧧 红包',color:'#FF6347'},
];

function getDefaultData(){
  return {
    exercise: {}, piano: {}, successDiary: {}, reflections: {},
    finance: {}, returns: {}, expenses: {}, memos: {}, yearExpenses: {},
    pianoChecklist: ['哈农练习','音阶琶音','练习曲','乐曲片段','视奏训练'],
    exerciseItems: ['跑步','健身课程','抗阻训练'],
    financeChecks: [...defaultFinanceChecks]
  };
}

// ==================== PERSISTENCE ====================

// Cloud sync config
const CLOUD_REPO = 'sundafa/family-menu';
const CLOUD_FILE = 'workbench-data.json';
let cloudToken = localStorage.getItem('wb_cloud_token') || '';
let syncTimer = null;
let lastSyncTime = 0;

function getCloudToken(){
  // Check URL param first, then localStorage
  const urlParams = new URLSearchParams(location.search);
  const t = urlParams.get('token');
  if(t){
    cloudToken = t;
    localStorage.setItem('wb_cloud_token', t);
    return t;
  }
  return cloudToken;
}

function updateSyncStatus(msg){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = msg;
}

async function cloudSave(){
  if(!cloudToken) return;
  try{
    updateSyncStatus('☁️ 同步中...');
    // Get current file sha (for update)
    let sha = '';
    try{
      const resp = await fetch(`https://api.github.com/repos/${CLOUD_REPO}/contents/${CLOUD_FILE}`,{
        headers:{'Authorization':`Bearer ${cloudToken}`,'Accept':'application/vnd.github+json'}
      });
      if(resp.ok){ const d=await resp.json(); sha=d.sha; }
    }catch(e){}
    
    // Upload new data
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(appData))));
    const resp = await fetch(`https://api.github.com/repos/${CLOUD_REPO}/contents/${CLOUD_FILE}`,{
      method:'PUT',
      headers:{'Authorization':`Bearer ${cloudToken}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'Auto sync workbench data',content:content,sha:sha||undefined})
    });
    if(resp.ok){
      lastSyncTime = Date.now();
      updateSyncStatus('☁️ 已同步 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
    }else if(resp.status===401){
      updateSyncStatus('⚠️ Token失效，请重新设置');
    }else{
      updateSyncStatus('⚠️ 同步失败');
    }
  }catch(e){
    updateSyncStatus('⚠️ 网络错误');
  }
}

async function cloudLoad(){
  if(!cloudToken) return null;
  try{
    updateSyncStatus('☁️ 加载云端数据...');
    const resp = await fetch(`https://api.github.com/repos/${CLOUD_REPO}/contents/${CLOUD_FILE}`,{
      headers:{'Authorization':`Bearer ${cloudToken}`,'Accept':'application/vnd.github+json'}
    });
    if(resp.ok){
      const d = await resp.json();
      const decoded = decodeURIComponent(escape(atob(d.content)));
      updateSyncStatus('☁️ 云端数据已加载');
      return JSON.parse(decoded);
    }
    updateSyncStatus('☁️ 云端暂无数据');
    return null;
  }catch(e){
    updateSyncStatus('⚠️ 加载失败');
    return null;
  }
}

function saveData(){
  localStorage.setItem('sun_workbench_v1', JSON.stringify(appData));
  // Auto cloud sync (debounced 3 seconds)
  if(cloudToken){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(()=>cloudSave(), 3000);
  }
}

function loadData(){
  const raw = localStorage.getItem('sun_workbench_v1');
  if(raw){ try{ appData = { ...getDefaultData(), ...JSON.parse(raw) }; }catch(e){ appData = getDefaultData(); } }
  else appData = getDefaultData();
  migrateData();
  // Async load from cloud
  if(getCloudToken()){
    cloudLoad().then(cloudData=>{
      if(cloudData){
        appData = { ...getDefaultData(), ...cloudData };
        migrateData();
        renderCurrentSection();
        updateSyncStatus('☁️ 已从云端恢复 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
      }
    });
  }else{
    updateSyncStatus('☁️ 点击设置云同步');
  }
}

function migrateData(){
  // migrate returns: number → {amount, note}
  Object.entries(appData.returns||{}).forEach(([k,v])=>{
    if(typeof v === 'number') appData.returns[k] = {amount:v,note:''};
  });
  if(!appData.pianoChecklist) appData.pianoChecklist = ['哈农练习','音阶琶音','练习曲','乐曲片段','视奏训练'];
  if(!appData.financeChecks) appData.financeChecks = [...defaultFinanceChecks];
  if(!appData.exerciseItems) appData.exerciseItems = ['跑步','健身课程','抗阻训练'];
  if(!appData.yearExpenses) appData.yearExpenses = {};
}

function ensureDay(key){
  if(!appData[key]) appData[key] = {};
  if(!appData[key][currentDate]) appData[key][currentDate] = initDayData(key);
  return appData[key][currentDate];
}

function initDayData(key){
  switch(key){
    case 'exercise': return {};
    case 'piano': return {checks:{},journal:''};
    case 'successDiary': return {entries:[],mood:'😊'};
    case 'reflections': return {insights:[''],mood:'💡'};
    case 'finance': return {operations:[],journal:''};
    case 'returns': return {amount:0,note:''};
    case 'expenses': return {food:0,transport:0,shopping:0,living:0,exerciseCost:0,learning:0,medical:0,entertainment:0,foodNote:'',transportNote:'',shoppingNote:'',livingNote:'',exerciseNote:'',learningNote:'',medicalNote:'',entertainmentNote:''};
    case 'memos': return {content:''};
    default: return {};
  }
}

// ==================== NAV ====================
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function switchSection(section){
  currentSection = section;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  const navItem = document.querySelector(`.nav-item[onclick="switchSection('${section}')"]`);
  if(navItem) navItem.classList.add('active');
  const secEl = document.getElementById('sec-'+section);
  if(secEl) secEl.classList.add('active');
  renderSection(section);
  if(window.innerWidth<769) toggleSidebar();
}

// ==================== SECTION RENDER ====================
function renderSection(section){
  switch(section){

// ==================== DATE NAV ====================
function dateNavHtml(extra=''){

function changeDate(delta){

function goToday(){

function addExerciseItem(){
  const input = document.getElementById('newExerciseItem');

function renderExerciseStats(){
  const weekStart = new Date(currentDate);
  const dayOfWeek = weekStart.getDay()||7;
  weekStart.setDate(weekStart.getDate()-dayOfWeek+1);
  let total=0, days=0;
  const labels=['一','二','三','四','五','六','日'];
  let bars='';
  for(let i=0;i<7;i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate()+i);
    const dk = d.toISOString().slice(0,10);
    const ed = (appData.exercise||{})[dk];
    let cnt = 0;
    if(ed){
      const items = appData.exerciseItems||['跑步','健身课程','抗阻训练'];
      for(let j=0;j<items.length;j++){
        if(ed['item_'+j]) cnt++;
      }
    }
    if(cnt>0){ total+=cnt; days++; }
    const h = cnt*28;
    const isToday = dk===currentDate;
    bars+=`<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:32px;height:${Math.max(h,8)}px;background:${isToday?'var(--p)':h?'var(--p4)':'#E8EDF2'};border-radius:6px 6px 0 0;transition:all .3s"></div>
      <span style="font-size:10px;color:var(--t2)">${labels[i]}</span>
      <span style="font-size:10px;font-weight:600;color:${cnt?'var(--p)':'var(--t3)'}">${cnt}项</span>
    </div>`;
  }
  return `<div style="display:flex;justify-content:space-around;align-items:flex-end;height:100px;padding:0 8px">${bars}</div>
    <div style="text-align:center;margin-top:12px;font-size:13px;color:var(--t2)">本周共完成 <b style="color:var(--p);font-size:18px">${total}</b> 项运动 · 打卡 <b style="color:var(--p);font-size:18px">${days}</b> 天</div>`;
}

function renderPianoMonthStats(){
  const [y,m] = currentDate.split('-');
  const items = appData.pianoChecklist||['哈农练习'];
  let days=0, totalItems=0;
  const dayBars = [];
  for(let i=1;i<=new Date(+y,+m,0).getDate();i++){
    const dk = `${y}-${m}-${String(i).padStart(2,'0')}`;
    const pd = (appData.piano||{})[dk];
    if(!pd||!pd.checks) continue;
    let cnt=0;
    for(let j=0;j<items.length;j++){ if(pd.checks[j]) cnt++; }
    if(cnt>0){ days++; totalItems+=cnt; dayBars.push({day:i,count:cnt}); }
  }
  const avg = days>0 ? (totalItems/days).toFixed(1) : '0';
  const now = new Date();
  const todayDay = +currentDate.slice(8,10);
  const isCurrentMonth = y===String(now.getFullYear()) && m===String(now.getMonth()+1).padStart(2,'0');
  if(!isCurrentMonth && !days) return '<div style="text-align:center;color:var(--t2);padding:16px">该月暂无练琴记录</div>';

  // Show day chart (compact bar)
  let barsHtml = '';
  const monthDays = new Date(+y,+m,0).getDate();
  for(let i=1;i<=monthDays;i++){
    const dk = `${y}-${m}-${String(i).padStart(2,'0')}`;
    const pd = (appData.piano||{})[dk];
    let cnt=0;
    if(pd&&pd.checks){
      for(let j=0;j<items.length;j++){ if(pd.checks[j]) cnt++; }
    }
    const isToday = isCurrentMonth && i===todayDay;
    const h = Math.max(cnt*10,3);
    barsHtml+=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
      <div style="width:${Math.max(100/monthDays*0.6,4)}px;height:${h}px;background:${isToday?'var(--p)':cnt?'var(--p4)':'#E8EDF2'};border-radius:3px 3px 0 0;min-height:3px"></div>
    </div>`;
  }

  return `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px">
    <div class="stat-card" style="flex:1;min-width:80px"><div class="stat-val" style="color:var(--p)">${days}</div><div class="stat-label">练琴天数</div></div>
    <div class="stat-card" style="flex:1;min-width:80px"><div class="stat-val" style="color:var(--p)">${totalItems}</div><div class="stat-label">完成项数</div></div>
    <div class="stat-card" style="flex:1;min-width:80px"><div class="stat-val" style="color:var(--p)">${avg}</div><div class="stat-label">日均完成</div></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;height:60px;padding:0 2px;gap:1px">${barsHtml}</div>
  <div style="display:flex;justify-content:space-between;padding:0 2px;margin-top:4px;gap:1px">
    <span style="font-size:9px;color:var(--t3)">1日</span><span style="font-size:9px;color:var(--t3)">${monthDays}日</span>
  </div>`;
}

function addInsightBox(){
  const day = ensureDay('reflections');
  if(!day.insights || !Array.isArray(day.insights)) day.insights = [''];
  const max = 6;
  if(day.insights.length >= max){toast(`最多 ${max} 条感悟`);return;}
  // save existing content first
  for(let i=0;i<day.insights.length;i++){
    const el = document.getElementById('reflect_'+i);
    if(el) day.insights[i] = el.value;
  }
  day.insights.push('');
  saveData();
  renderReflections();
}

function removeInsightBox(idx){
  const day = ensureDay('reflections');
  if(!day.insights || !Array.isArray(day.insights) || day.insights.length <= 1) return;
  // save existing
  for(let i=0;i<day.insights.length;i++){
    const el = document.getElementById('reflect_'+i);
    if(el) day.insights[i] = el.value;
  }
  day.insights.splice(idx,1);
  saveData();
  renderReflections();
}

function saveReflections(){
  const day = ensureDay('reflections');
  if(!day.insights || !Array.isArray(day.insights)) day.insights = [''];
  for(let i=0;i<day.insights.length;i++){
    const el = document.getElementById('reflect_'+i);
    if(el) day.insights[i] = el.value;
  }
  // remove trailing empties (keep at least 1)
  while(day.insights.length>1 && !day.insights[day.insights.length-1].trim()){
    day.insights.pop();
  }
  saveData();
  toast('心得已保存 ✨');
}

function setReflectMood(mood){
  const day = ensureDay('reflections');
  day.mood = mood;
  saveData();
  renderReflections();
}

function renderReflectTimeline(){
  const entries = [];
  Object.entries(appData.reflections||{}).forEach(([d,v])=>{
    let content = '';
    if(v.insights && Array.isArray(v.insights)){
      content = v.insights.filter(s=>s&&s.trim()).map((s,i)=>`💡 ${s.slice(0,80)}${s.length>80?'...':''}`).join('<br>');
    }
    // migrate old single-insight format
    if(!content && v.insight && v.insight.trim()){
      content = '💡 '+v.insight.slice(0,80)+(v.insight.length>80?'...':'');
    }
    if(content) entries.push({date:d,mood:v.mood||'💡',content});
  });
  entries.sort((a,b)=>b.date.localeCompare(a.date));
  if(!entries.length) return '<div style="text-align:center;color:var(--t2);padding:20px">还没有记录，开始写吧 ✍️</div>';
  return '<div class="entry-list">'+entries.slice(0,20).map(e=>`<div class="entry-item">
    <div class="entry-date">📅 ${e.date} <span class="entry-mood">${e.mood}</span></div>
    <div class="entry-content">${e.content}</div>
  </div>`).join('')+'</div>';
}

function addTradeOp(){
  const type = document.getElementById('tradeType').value;
  const name = document.getElementById('tradeName').value.trim();
  const total = parseFloat(document.getElementById('tradeTotal').value)||0;
  const note = document.getElementById('tradeNote').value.trim();
  if(!name){ toast('请输入标的名称'); return; }
  if(!total){ toast('请输入成交金额'); return; }
  const day = ensureDay('finance');
  if(!day.operations) day.operations = [];
  day.operations.push({id:uid(),type,name,total,note,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});
  saveData();
  renderFinance();

function renderFinanceStats(){
  const day = (appData.finance||{})[currentDate];
  if(!day||!day.operations||day.operations.length===0){
    return '<div style="text-align:center;color:var(--t2);padding:12px">暂无操作，添加第一条吧 📝</div>';
  }
  let buyTotal=0, sellTotal=0, buyCount=0, sellCount=0;
  day.operations.forEach(op=>{

    else{ sellTotal+=val; sellCount++; }

  return `<div class="stats-row">

function drawFinancePieFromOps(ops){
  const ctx = document.getElementById('financeChart');
  if(!ctx) return;
  if(financeChartInst) financeChartInst.destroy();
  if(!ops||ops.length===0){
    financeChartInst = new Chart(ctx,{
      type:'doughnut',
      data:{labels:['暂无操作'],datasets:[{data:[1],backgroundColor:['#E8EDF2'],borderWidth:0}]},
      options:{responsive:true,plugins:{legend:{display:false}},cutout:'65%'}
    });
    return;
  }
  let buyVal=0, sellVal=0;
  ops.forEach(op=>{
    const v=op.total!==undefined?op.total:op.amount*op.price;
    if(op.type==='buy') buyVal+=v; else sellVal+=v;
  });
  financeChartInst = new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['买入','卖出'],
      datasets:[{data:[buyVal,sellVal],backgroundColor:['#FF6B6B','#27AE60'],borderWidth:0,borderRadius:6}]
    },
    options:{
      responsive:true,
      plugins:{legend:{position:'bottom',labels:{padding:16,font:{size:13}}}},

    }
  });
}

// ==================== CALENDAR COMPONENT ====================
function renderCalHtml(dataKey, todayVal){
  const [y,m]=currentDate.split('-');
  calYear = +y; calMonth = +m-1;
  selectedCalDay = currentDate;
  const daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  const firstDay = new Date(calYear,calMonth,1).getDay()||7;
  const prevDays = new Date(calYear,calMonth,0).getDate();
  const todayStr = today();
  let cells = '';
  // day headers
  const dayHeaders = ['一','二','三','四','五','六','日'];
  // prev month
  for(let i=firstDay-1;i>0;i--){
    const d = prevDays-i+1;
    const prevM = calMonth===0?12:calMonth;
    const prevY = calMonth===0?calYear-1:calYear;
    const dk = `${prevY}-${String(prevM).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=`<div class="cal-cell other-month" onclick="selectCalDay('${dk}')"><div class="day-num">${d}</div></div>`;
  }
  // current month
  for(let i=1;i<=daysInMonth;i++){
    const dk = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const isToday = dk===todayStr;
    const isSelected = dk===selectedCalDay;
    const val = getCalCellVal(dataKey,dk);
    cells+=`<div class="cal-cell${isToday?' today':''}${isSelected?' selected':''}" onclick="selectCalDay('${dk}')">
      <div class="day-num">${i}</div>
      ${val!==null?`<div class="day-val${typeof val==='number'?val>=0?' positive':' negative':''}">${typeof val==='number'?formatMoney(Math.abs(val)):val}</div>`:''}
    </div>`;
  }
  // next month
  const remaining = 42 - (firstDay-1+daysInMonth);
  for(let i=1;i<=remaining;i++){
    const nextM = calMonth===11?1:calMonth+2;
    const nextY = calMonth===11?calYear+1:calYear;
    const dk = `${nextY}-${String(nextM).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    cells+=`<div class="cal-cell other-month" onclick="selectCalDay('${dk}')"><div class="day-num">${i}</div></div>`;
  }
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  return `<div class="card"><h3>📅 月度日历</h3>
    <div class="cal-header">
      <button class="cal-nav" onclick="calPrevMonth('${dataKey}')">◀</button>
      <span class="month-label">${calYear}年 ${monthNames[calMonth]}</span>
      <button class="cal-nav" onclick="calNextMonth('${dataKey}')">▶</button>
    </div>
    <div class="cal-grid">
      ${dayHeaders.map(h=>`<div class="cal-day-header">${h}</div>`).join('')}
      ${cells}
    </div>
  </div>`;
}

function getCalCellVal(key,dk){
  const data = appData[key];
  if(!data||!data[dk]) return null;
  if(key==='returns'){ const v=data[dk]; return typeof v==='number'?v:(v.amount||0); }
  if(key==='expenses'){
    let t=0;
    expenseCats.forEach(c=>{ t+=Number(data[dk][c.key])||0; });
    return t===0?null:-t;
  }
  if(key==='memos') return data[dk].content?'📝':'';
  return null;
}

function calPrevMonth(dataKey){
  calMonth--;
  if(calMonth<0){ calMonth=11; calYear--; }
  renderCurrentSection();
}

function calNextMonth(dataKey){
  calMonth++;
  if(calMonth>11){ calMonth=0; calYear++; }
  renderCurrentSection();
}

function selectCalDay(dk){
  currentDate = dk;
  renderCurrentSection();
}

          style="width:100%;padding:8px 12px;border:1px solid #E8EDF2;border-radius:8px;font-size:14px;box-sizing:border-box">
        <div style="font-size:11px;color:#BDC3C7;margin-top:4px">
          需要 repo 权限。<a href="https://github.com/settings/tokens/new?scopes=repo&description=workbench-sync" target="_blank" style="color:#5B9BD5">点此创建</a>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="saveSyncSettings()" style="flex:1;padding:10px;background:#5B9BD5;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">保存设置</button>
        <button onclick="document.getElementById('syncModal').remove()" style="flex:1;padding:10px;background:#f5f5f5;color:#7F8C8D;border:none;border-radius:8px;font-size:14px;cursor:pointer">取消</button>
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid #E8EDF2">
        <button onclick="manualSyncNow()" style="width:100%;padding:8px;background:#27AE60;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer">🔄 立即同步一次</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.remove(); });
}

function saveSyncSettings(){
  const val = document.getElementById('syncTokenInput').value.trim();
  if(val){
    cloudToken = val;
    localStorage.setItem('wb_cloud_token', val);
    updateSyncStatus('☁️ 设置成功，正在同步...');
    cloudSave();
    toast('✅ 云同步已开启');
  }else{
    localStorage.removeItem('wb_cloud_token');
    cloudToken = '';
    updateSyncStatus('☁️ 云同步已关闭');
    toast('已关闭云同步');
  }
  document.getElementById('syncModal').remove();
}

async function manualSyncNow(){
  if(!cloudToken){
    const val = document.getElementById('syncTokenInput').value.trim();
    if(val){ cloudToken=val; localStorage.setItem('wb_cloud_token',val); }
  }
  if(!cloudToken){ toast('请先填写Token'); return; }
  document.getElementById('syncModal').remove();
  await cloudSave();
  toast('✅ 同步完成');
}

// ==================== INIT ====================
loadData();
renderAllSections();

// Handle back/forward
window.addEventListener('hashchange',()=>{
  // Cloud sync mode: no URL hash sharing needed
  if(cloudToken) return;
  renderCurrentSection();
});

// Sync before leaving page
window.addEventListener('beforeunload',()=>{
  if(cloudToken && Date.now()-lastSyncTime>5000){
    clearTimeout(syncTimer);
    cloudSave();
  }
});
</script>
</body>
</html>
